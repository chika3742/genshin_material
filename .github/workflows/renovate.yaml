name: Renovate

on:
  schedule:
    - cron: "0 17 * * *"
      timezone: "Asia/Tokyo"
  push:
    branches:
      - main
  workflow_dispatch:
  # Checkboxes on the Dependency Dashboard and on Renovate PRs
  issues:
    types:
      - edited
  pull_request:
    types:
      - edited

permissions: {}

jobs:
  renovate:
    name: Renovate
    # For edits, run only when someone other than Renovate ticks a checkbox on a Renovate issue or PR
    if: >-
      (github.event_name != 'issues' && github.event_name != 'pull_request') ||
      (github.actor != 'renovate-dependency-updates[bot]' && (
        (github.event_name == 'issues'
          && github.event.issue.user.login == 'renovate-dependency-updates[bot]'
          && contains(github.event.issue.body, '- [x]')) ||
        (github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'renovate-dependency-updates[bot]'
          && contains(github.event.pull_request.body, '- [x] <!-- rebase-check -->'))))
    # Job-level, so runs whose job is skipped do not replace a pending run
    concurrency:
      group: renovate
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^\\./scripts/ci_codegen\\.sh$"]'
