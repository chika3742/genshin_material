name: Code Review with Claude
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize

jobs:
  claude:
    if: github.event.pull_request.author_association == 'OWNER' && (github.event.action != 'synchronize' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-opus-5\
            --mcp-config '
              {
                "mcpServers": {
                  "github_public": {
                    "type": "http",
                    "url": "https://api.githubcopilot.com/mcp/x/repos/readonly",
                    "headers": { "Authorization": "Bearer ${{ secrets.REPOS_READONLY_GITHUB_TOKEN }}" }
                  }
                }
              }
            '\
            --allowed-tools "mcp__github_public__*"\
            --append-system-prompt "返答はすべて日本語で行うこと。依存するライブラリのAPIを確認する必要が生じたときは、`mcp__github_public__*`のツールを使用すること。特に、想像で存在しないAPIをでっち上げないよう、よく確認すること。レビューにはLint/Testの結果を用いないこと。flutter analyzeを実行したり、CIの結果を取得したりしない。そしてそれは当然のことであり、その旨を最終結果に出力しないこと。"
