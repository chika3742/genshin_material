name: Code Review with Claude
on:
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - opened
      - ready_for_review

jobs:
  claude:
    if: (github.event_name == 'pull_request' && github.event.pull_request.author_association == 'OWNER' && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') && github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Agent mode doesn't check out the PR, and issue_comment would otherwise get the default branch
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1.0.258
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review ${{ github.event.pull_request.number || github.event.issue.number }} --comment ${{ github.event.comment.body }}"
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --mcp-config '
              {
                "mcpServers": {
                  "github_public": {
                    "type": "http",
                    "url": "https://api.githubcopilot.com/mcp/x/repos/readonly",
                    "headers": { "Authorization": "Bearer ${{ secrets.REPOS_READONLY_GITHUB_TOKEN }}" }
                  }
                }
              }
            '
            --allowed-tools "mcp__github_public__*,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api --paginate repos/{owner}/{repo}/pulls/*/comments),Bash(gh issue view:*),Bash(grep:*),Bash(wc:*)"
