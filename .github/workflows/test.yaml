name: Test & Lint

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Init Flutter SDK
        uses: chika3742/setup-fvm@8846c1a1b7557ed285858cda0dece0311c31f2d6 # v3.2.0

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Lint
        id: lint
        run: fvm flutter analyze

      - name: Test
        if: ${{ !cancelled() && contains(fromJSON('["success", "failure"]'), steps.lint.outcome) }}
        run: ./scripts/coverage.sh

      - name: Report coverage
        # Reporting only. Coverage never fails the job.
        if: ${{ !cancelled() && hashFiles('coverage/lcov-filtered.info') != '' }}
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```'
            lcov --summary coverage/lcov-filtered.info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
